name: Build RideAssistPro IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unsigned App for iPhone
        run: |
          xcodebuild clean build \
            -project RideAssistPro.xcodeproj \
            -scheme RideAssistPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/RideAssistPro.app Payload/
          zip -r RideAssistPro_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideAssistPro-iPhone-IPA
          path: RideAssistPro_Unsigned.ipa
